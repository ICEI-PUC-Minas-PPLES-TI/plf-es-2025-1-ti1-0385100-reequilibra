<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividades Distrativas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Atividades distrativas</h1>
      <p>Pausas saudáveis para sua mente</p>
      
      <div class="selecao-usuario">
        <label>👤 Usuário: 
          <select id="usuario">
            <option value="admin">Administrador</option>
            <option value="user">Usuário Comum</option>
            <option value="rommel">Rommel</option>
          </select>
        </label>
      </div>
    </header>

    <div class="controle-tempo">
      <label>⏱ Tempo: 
        <select id="tempo">
          <option value="1">1 minuto</option>
          <option value="3">3 minutos</option>
          <option value="5" selected>5 minutos</option>
        </select>
      </label>
    </div>

    <div class="atividades">
      <div class="card" data-atividade="respirar">
        <h3>🌬 Respiração Guiada</h3>
        <p>Exercício 4-7-8 para acalmar</p>
        <button>Iniciar</button>
      </div>

      <div class="card" data-atividade="desenhar">
        <h3>🎨 Desenho Livre</h3>
        <p>Expressão sem julgamentos</p>
        <button>Iniciar</button>
      </div>

      <div class="card" data-atividade="musica">
        <h3>🎧 Música Relaxante</h3>
        <p>Sons da natureza</p>
        <button>Iniciar</button>
      </div>
    </div>

    <div class="missoes">
      <h2>📅 Missões Diárias</h2>
      <ul id="lista-missoes"></ul>
    </div>
  </div>

  <script src="script.js"></script>
  <div id="temporizador" style="
  display: none;
  position: fixed;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 3rem;
  background: white;
  border: 3px solid #01AE7D;
  padding: 20px 40px;
  border-radius: 10px;
  z-index: 1000;
  color: #01AE7D;
  box-shadow: 0 0 20px rgba(0,0,0,0.2);
">
  ⏳ 00:00
</div>

</body>
</html>
