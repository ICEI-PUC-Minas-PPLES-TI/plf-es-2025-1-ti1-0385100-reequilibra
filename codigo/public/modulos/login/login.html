<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reequilibra | Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #20b2aa;
        --primary-hover: #1a9b94;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        min-height: 100vh;
      }

      .login-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .login-card {
        background: white;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        padding: 2.5rem;
        max-width: 400px;
        width: 100%;
      }

      .btn-primary {
        background: var(--primary);
        border: none;
        border-radius: 8px;
      }

      .btn-primary:hover {
        background: var(--primary-hover);
      }
    </style>
  </head>

  <body>

    
    <div class="login-container">
      <div class="login-card">
        <div class="text-center mb-4">
          <a href="../../index.html">
            <img style="width: 100px;" class="justify-content-center mb-4 align-items-center"
            src="../../assets/images/logo.png"
            alt="Reequilibra"
            class="logo"
            />
          </a>

          <h2 class="fw-bold text-dark">Bem-vindo</h2>
          <p class="text-muted">Entre na sua conta</p>
        </div>
        
        <form id="login-form">
          <div class="mb-3">
            <label class="form-label">Login</label>
            <input
              type="text"
              id="username"
              class="form-control"
              placeholder="Digite seu login ou e-mail"
              required
            />
          </div>

          <div class="mb-3">
            <label class="form-label">Senha</label>
            <input
              type="password"
              id="password"
              class="form-control"
              placeholder="Digite sua senha"
              required
            />
          </div>

          <button type="submit" class="btn btn-primary w-100 mb-3">
            Entrar
          </button>

          <div class="text-center">
            <a href="cadastro.html" class="btn btn-outline-primary w-100"
              >Criar conta</a
            >
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/login.js"></script>
  </body>
</html>
