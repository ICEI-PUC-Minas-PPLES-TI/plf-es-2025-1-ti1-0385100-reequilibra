<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Reequilibra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/global-theme.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: var(--background);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: var(--card-background);
            border-radius: 20px;
            box-shadow: 0 20px 40px var(--shadow-elevated);
            overflow: hidden;
            max-width: 400px;
            width: 100%;
            margin: 2rem;
            border: 1px solid var(--border);
        }

        .login-header {
            background: var(--primary-green);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .login-header img {
            width: 80px;
            height: auto;
            margin-bottom: 1rem;
        }

        .login-form {
            padding: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-control {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 12px;
            padding: 0.75rem 1rem;
        }

        .form-control:focus {
            border-color: var(--primary-green);
            background: var(--surface-elevated);
            box-shadow: 0 0 0 0.2rem rgba(1, 174, 125, 0.25);
        }

        .btn-primary {
            background: var(--primary-green);
            border: none;
            border-radius: 12px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            width: 100%;
        }

        .btn-primary:hover {
            background: var(--primary-green-soft);
            transform: translateY(-2px);
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            background: var(--primary-green);
            color: white;
        }

        .login-footer {
            text-align: center;
            padding: 1rem 2rem 2rem;
        }

        .login-footer a {
            color: var(--primary-green);
            text-decoration: none;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle">
        <i class="fas fa-moon"></i>
    </button>

    <div class="login-container">
        <div class="login-header">
            <img src="../../assets/images/logo-white.png" alt="Reequilibra" class="logo">
            <h2>Bem-vindo de volta!</h2>
            <p>Entre na sua conta para continuar</p>
        </div>
        
        <form class="login-form" id="loginForm">
            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            
            <div class="form-group">
                <label for="password" class="form-label">Senha</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-sign-in-alt"></i> Entrar
            </button>
        </form>
        
        <div class="login-footer">
            <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se aqui</a></p>
            <p><a href="../../index.html">← Voltar ao início</a></p>
        </div>
    </div>

    <script src="../../assets/js/theme-manager.js"></script>
    <script src="scripts/login.js"></script>
</body>
</html>
