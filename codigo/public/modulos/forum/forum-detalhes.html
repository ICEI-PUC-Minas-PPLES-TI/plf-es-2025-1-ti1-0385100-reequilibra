<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>reequilibra - Detalhes do Fórum</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="./CSS/style.css">
</head>
<body>
  <header id="header" class="shadow d-flex bg-white fixed-top">
    <nav class="container bg-white d-flex justify-content-between align-items-center py-2">
      <div>
        <button id="btnsqr" class="btn text-light fs-5 border-0" type="button" data-bs-toggle="collapse" data-bs-target="#menuMobile" style="width: 60px; height: 60px; background-color: #01AE7D;">
          ☰
        </button>
      </div>
      <img src="../../codigo/public/assets/images/logo.jpeg" alt="logo" style="height: 86px; width: auto;">
      <div class="d-flex gap-2">
        <button type="button" class="btn btn-outline-secondary">Login</button>
        <button id="signup" type="button" class="btn text-white" style="background-color: #01AE7D;">Sign Up</button>
      </div>
    </nav>

    <div class="collapse position-absolute w-100 bg-white shadow-sm" id="menuMobile" style="z-index: 1000; top: 60px;">
      <div class="p-3">
        <a href="#" class="d-block text-secondary fs-5 py-2 px-3">Pesquisar</a>
        <a href="#" class="d-block text-secondary fs-5 py-2 px-3">Sobre Saúde Mental</a>
        <a href="#" class="d-block text-secondary fs-5 py-2 px-3">Ferramentas de Autocuidado</a>
        <a href="#" class="d-block text-secondary fs-5 py-2 px-3">Recursos</a>
        <a href="#" class="d-block text-secondary fs-5 py-2 px-3">Comunidade</a>
      </div>
    </div>
  </header>

  <main class="container mt-5 pt-5">
    <div class="row">
      <div class="col-12">
        <!-- Botão Voltar -->
        <a href="index.html" class="btn btn-outline-secondary mb-4">
          <i class="bi bi-arrow-left"></i> Voltar para Fóruns
        </a>
        
        <!-- Detalhes do Fórum -->
        <div id="forumDetails" class="bg-white p-4 rounded shadow-sm mb-4">
          <!-- Conteúdo carregado dinamicamente -->
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Carregando...</span>
          </div>
        </div>
        
        <!-- Comentários -->
        <div class="bg-white p-4 rounded shadow-sm mb-4">
          <h4 class="mb-4">Comentários</h4>
          <div id="commentsList" class="mb-4">
            <!-- Comentários carregados dinamicamente -->
          </div>
          
          <!-- Formulário de Comentário -->
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Adicionar Comentário</h5>
              <form id="commentForm">
                <div class="mb-3">
                  <label for="commentAuthor" class="form-label">Seu Nome</label>
                  <input type="text" class="form-control" id="commentAuthor" required>
                </div>
                <div class="mb-3">
                  <label for="commentContent" class="form-label">Comentário</label>
                  <textarea class="form-control" id="commentContent" rows="3" required></textarea>
                </div>
                <div class="mb-3 form-check">
                  <input type="checkbox" class="form-check-input" id="isHealthProfessional">
                  <label class="form-check-label" for="isHealthProfessional">Sou profissional de saúde</label>
                </div>
                <button type="submit" class="btn btn-custom">Enviar Comentário</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./scripts/forum-detalhes.js"></script>
</body>
</html>
