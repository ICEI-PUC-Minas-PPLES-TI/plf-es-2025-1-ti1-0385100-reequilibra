<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psicólogos - Reequilibra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>
    <header class="cabecalho-principal">
        <div class="perfil-cabecalho">
            <img src="https://randomuser.me/api/portraits/women/65.jpg" alt="Foto de perfil" class="foto-perfil">
            <div class="logo">Reequilibra</div>
        </div>

        <div class="barra-pesquisa">
            <input type="text" id="input-busca" placeholder="Buscar psicólogo por especialidade...">
            <button type="submit" id="btn-busca">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>
    </header>

    <main class="conteudo-principal">
        <div class="titulo-container">
            <h1 class="titulo-pagina">Psicólogos Disponíveis</h1>
            <div class="detalhe-titulo"></div>
        </div>

        <div class="container-psicologos">

        </div>
    </main>

    <footer class="rodape">
        <hr class="linha-rodape">
        <p class="creditos">Copyright ©2025 All rights reserved | <a>Reequilibra</a></p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/scripts/app.js"></script>
</body>
</html>
