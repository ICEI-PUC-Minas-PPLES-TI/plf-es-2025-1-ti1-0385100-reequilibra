<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reequilibra - To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Editar Tarefa</h3>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editId">
                <input type="text" id="editTitulo" placeholder="Título da tarefa">
                <select id="editStatus">
                    <option value="1">Pendente</option>
                    <option value="2">Em Progresso</option>
                    <option value="3">Concluída</option>
                </select>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="fecharModal()">Cancelar</button>
                <button class="btn-primary" onclick="salvarEdicao()">Salvar</button>
            </div>
        </div>
    </div>

    <header class="header">
        <div class="container">
            <div class="logo">
                <img src="../../assets/images/logo.png" alt="Reequilibra">
            </div>
            <div class="nav-menu" id="navMenu">
                <a href="../../index.html" class="nav-link active">Início</a>
                <a href="../missoes/index.html" class="nav-link">Serviços</a>
            </div>
            <nav class="nav">
                <button class="btn-outline">Login</button>
                <button class="btn-primary">Sign Up</button>
            </nav>
        </div>
    </header>

    <main class="container main-content">
        <div class="content-grid">
            <div class="form-section">
                <h2>Nova Tarefa</h2>
                <div class="form-group">
                    <input type="text" id="tituloTarefa" placeholder="Digite o título da tarefa" class="input-large">
                    <button onclick="adicionarTarefa()" class="btn-primary btn-full">Adicionar Tarefa</button>
                </div>
            </div>

            <div class="tasks-section">
                <div class="tasks-header">
                    <h2>Minhas Tarefas</h2>
                    <div class="task-actions">
                        <button onclick="limparCampo()" class="btn-icon" title="Nova tarefa">+</button>
                    </div>
                </div>
                <div id="listaTarefas" class="tasks-list"></div>
            </div>
        </div>
    </main>

    <script src="./scripts/app.js"></script>
</body>
</html>
