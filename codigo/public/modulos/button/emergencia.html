<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botão de emergência siplificado</title>
        <link rel="stylesheet" href="emergencia.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
     <div class="emergency-container">
        <button id="emergencyBtn" class="emergency-btn">
            EMERGÊNCIA
        </button>
          <div id="emergencyPanel" class="emergency-panel">
            <div class="panel-header">
                <h2>OPÇÕES DE AJUDA</h2>
                <button id="closePanel" class="close-btn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
                <div class="option" id="cvvOption">
                <h3>Ligar para CVV</h3>
                <p>188 - 24h gratuito</p>
            </div>
            
            <div class="option" id="contactsOption">
                <h3>Contatos de Confiança</h3>
                <p>Pessoas próximas</p>
            </div>
            
            <div class="option" id="servicesOption">
                <h3>Serviços de Saúde</h3>
                <p>CAPS e hospitais</p>
            </div>
        </div>
    </div>
    <div id="contactsModal" class="neon-modal">
        <div class="modal-content">
            <h3 class="modal-title">CONTATOS DE CONFIANÇA</h3>
            <div class="contacts-list" id="contactsList">
              
            </div>
            <div class="modal-buttons">
                <button class="modal-btn cancel-btn">Fechar</button>
            </div>
        </div>
    </div>
     <div id="servicesModal" class="neon-modal">
        <div class="modal-content">
            <h3 class="modal-title">SERVIÇOS DE SAÚDE PRÓXIMOS</h3>
            <div class="services-list" id="servicesList">
              
            </div>
            <div class="modal-buttons">
                <button class="modal-btn cancel-btn">Fechar</button>
            </div>
        </div>
    </div>
    <script src="emergencia.js"></script>
</body>
</html>
