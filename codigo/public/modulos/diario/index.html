<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!DOCTYPE html>
    <html lang="pt-BR">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>reequilibra - Diário Pessoal</title>

        <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
          rel="stylesheet"
        />

        <link
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
          rel="stylesheet"
        />
        <link
          rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        />
        <link
          href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet"
        />

        <link rel="stylesheet" href="./assets/CSS/style.css" />
        <link rel="stylesheet" href="../../styles.css" />
        >

        <link rel="stylesheet" href="./assets/CSS/style2.css" />
        <link rel="stylesheet" href="../../assets/css/emergencia.css" />
      </head>
      <body>
        <script src="../login/scripts/login.js"></script>

        <!-- HEADER -->
        <header class="header">
          <nav class="nav">
            <div class="nav-brand">
              <a href="../../index.html">
                <img
                  src="../../assets/images/logo.png"
                  alt="Reequilibra"
                  class="logo"
                />
              </a>
            </div>
            <div class="nav-menu" id="navMenu">
              <a href="#home" class="nav-link">Início</a>
              <a href="#about" class="nav-link">Sobre</a>
              <a href="#services" class="nav-link">Serviços</a>
              <a href="#testimonials" class="nav-link">Depoimentos</a>
            </div>
            <div class="nav-actions">
              <a
                id="loginBtn"
                href="./modulos/login/login.html"
                class="nav-link"
                >Login</a
              >
              <a
                id="signupBtn"
                href="./modulos/login/cadastro.html"
                class="btn btn-outline"
                >Cadastro</a
              >
              <a id="logoutBtn" onclick="logoutUser()" class="btn btn-danger"
                >Logout</a
              >
              <button
                class="theme-toggle"
                id="themeToggle"
                aria-label="Alternar tema"
              >
                <i class="fas fa-moon"></i>
              </button>
              <button class="mobile-toggle" id="mobileToggle">
                <span></span>
                <span></span>
                <span></span>
              </button>
            </div>
          </nav>
        </header>

        <main class="container" style="margin-top: 100px">
          <div id="menuCriarDiario" class="row">
            <!-- COLUNA 1 -->
            <div class="col-lg-8 bg-white p-4">
              <h3 class="mb-4">Título</h3>
              <div class="mb-4">
                <input
                  id="tituloDiario"
                  type="text"
                  class="form-control fs-3"
                  placeholder="Título do diário"
                />
              </div>

              <div class="d-flex justify-content-between mb-4">
                <div
                  id="status"
                  class="d-flex justify-content-center gap-5 mb-4"
                >
                  <h3 class="mb-3">Como está se sentindo hoje?</h3>
                </div>
                <div class="ms-4 d-flex gap-2">
                  <button
                    id="btnStatus1"
                    class="btn btn-light border border-secondary"
                    onclick="defStatusDiario(1)"
                  >
                    1
                  </button>
                  <button
                    id="btnStatus2"
                    class="btn btn-light border border-secondary"
                    onclick="defStatusDiario(2)"
                  >
                    2
                  </button>
                  <button
                    id="btnStatus3"
                    class="btn btn-light border border-secondary"
                    onclick="defStatusDiario(3)"
                  >
                    3
                  </button>
                  <button
                    id="btnStatus4"
                    class="btn btn-light border border-secondary"
                    onclick="defStatusDiario(4)"
                  >
                    4
                  </button>
                  <button
                    id="btnStatus5"
                    class="btn btn-light border border-secondary"
                    onclick="defStatusDiario(5)"
                  >
                    5
                  </button>
                </div>
              </div>

              <h3 class="mb-3">Escreva sobre o que quiser</h3>
              <div class="mb-4">
                <textarea
                  id="textoDiario"
                  class="form-control fs-4"
                  placeholder="..."
                  rows="6"
                ></textarea>
              </div>

              <button type="submit" id="btnSalvarDiario" class="btn w-100">
                Salvar Diário
              </button>
            </div>

            <!-- COLUNA 2 -->
            <div id="coluna2" class="col-lg-4 bg-light p-4">
              <div class="d-flex justify-content-between mb-3">
                <h3>Meus Diários</h3>
                <div>
                  <button
                    onclick="limpaCampos(); noDiarySelected();"
                    class="btn btn-custom"
                  >
                    <i class="bi bi-plus"></i>
                  </button>
                  <button
                    onclick="deleteDiario(selectedDiario, listaDiarios)"
                    class="btn btn-danger"
                  >
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </div>

              <div id="diario1"></div>
            </div>
          </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>

        <script>
          function verificaUsuarioCorrente() {
            const usuarioCorrenteJSON = localStorage.getItem("usuarioLogado");
            if (!usuarioCorrenteJSON) {
              window.location.href = "../login/login.html";
            }
          }

          verificaUsuarioCorrente();

          document.getElementById("diario1").innerHTML = "";

          let concatenador = "";

          function listaDiarios() {
            let concatenador = "";
            return new Promise((resolve, reject) => {
              fetch(diariosUrl)
                .then((response) => response.json())
                .then((data) => {
                  let diarioContainer = document.getElementById("diario1");
                  diarioContainer.innerHTML = "";

                  data.forEach((diario) => {
                    concatenador += `
                          <div id="card${diario.id}" onclick="selecionaDiario(${diario.id}); noDiarySelected()" class="bg-light card mb-3 shadow-lg">
                              <h5 class="card-title text-start ps-3">${diario.titulo}</h5>
                              <p class="card-subtitle text-start ps-3">Criado em: ${diario.data} - Status: ${diario.status}</p>
                              <p class=" text-start ps-3">${diario.conteudo}</p>
                          </div>
                      `;
                  });

                  diarioContainer.innerHTML = concatenador;
                  resolve();
                })
                .catch((error) => {
                  console.error("Erro ao carregar diários:", error);
                });
            });
          }

          document.addEventListener("DOMContentLoaded", () => {
            noDiarySelected();
            listaDiarios();
          });
        </script>

        <script src="../../script.js"></script>
        <script src="../../assets/js/app.js"></script>
        <script src="./assets/scripts/app.js"></script>

        <button id="emergencyBtn" class="emergency-btn">
          <i class="fas fa-exclamation-triangle"></i>
          <span>SOS</span>
        </button>

        <div id="emergencyModal" class="modal">
          <div class="modal-content">
            <div class="modal-header">
              <h2><i class="fas fa-heart-pulse"></i> EMERGÊNCIA</h2>
              <button id="closeModal" class="close-btn">
                <i class="fas fa-times"></i>
              </button>
            </div>

            <div class="emergency-grid">
              <div class="emergency-card cvv" onclick="callCVV()">
                <div class="card-icon"><i class="fas fa-phone"></i></div>
                <div class="card-content">
                  <h3>CVV 188</h3>
                  <p>24h gratuito</p>
                </div>
              </div>

              <div class="emergency-card contacts" onclick="showContacts()">
                <div class="card-icon"><i class="fas fa-users"></i></div>
                <div class="card-content">
                  <h3>Contatos</h3>
                  <p>Pessoas próximas</p>
                </div>
              </div>

              <div class="emergency-card samu" onclick="callSAMU()">
                <div class="card-icon"><i class="fas fa-ambulance"></i></div>
                <div class="card-content">
                  <h3>SAMU 192</h3>
                  <p>Emergência médica</p>
                </div>
              </div>

              <div class="emergency-card caps" onclick="showServices()">
                <div class="card-icon"><i class="fas fa-hospital"></i></div>
                <div class="card-content">
                  <h3>CAPS BH</h3>
                  <p>Saúde mental</p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <script src="../../assets/js/emergencia.js"></script>
      </body>
    </html>
  </head>
</html>
