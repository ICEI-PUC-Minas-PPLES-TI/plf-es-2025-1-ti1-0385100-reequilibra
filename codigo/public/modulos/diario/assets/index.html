  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
  <script src="scripts/app.js"></script>



  <script>
    let concatenador = '';
    function listaDiarios() {
    concatenador = ''; // Redefine o conteúdo para evitar duplicação

    concatenador = ''; 

    fetch(apiUrl)
        .then(response => response.json())
        .then(data => {
            const diarioContainer = document.getElementById('diario1');
            if (diarioContainer) {
                data.forEach((diario, i) => {
                  diarioID = diario.id || i;
                  
                    concatenador += `
                        <div id="card${diarioID}" onclick="selecionaDiario(${diarioID})" class="bg-light card mb-3">
                            <h5 class="card-title text-start ps-3">${diario.titulo}</h5>
                            <p class="card-subtitle text-start ps-3">Criado em: ${diario.data} - Status: ${diario.status}</p>
                            <p class="text-muted text-start ps-3">${diario.conteudo}</p>
                        </div>
                    `;
                });
                diarioContainer.innerHTML = concatenador;
            } else {
                console.error("Elemento com ID 'diario1' não encontrado.");
            }
        })
        .catch(error => {
            console.error('Erro ao buscar os diários:', error);
        });


  
}




      document.addEventListener('DOMContentLoaded', () => {
    listaDiarios(1);
});
    
  


  </script>
