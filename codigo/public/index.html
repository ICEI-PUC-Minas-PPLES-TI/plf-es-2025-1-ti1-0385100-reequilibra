<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reequilibra</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <nav class="nav">
        <div class="nav-brand">
          <a href="#home">
            <img
              src="./assets/images/logo.png"
              alt="Reequilibra"
              class="logo"
            />
          </a>
        </div>
        <div class="nav-menu" id="navMenu">
          <a href="#home" class="nav-link">Início</a>
          <a href="#about" class="nav-link">Sobre</a>
          <a href="#services" class="nav-link">Serviços</a>
          <a href="#testimonials" class="nav-link">Depoimentos</a>
        </div>
        <div class="nav-actions">
          <a href="#" class="nav-link">Login</a>
          <a href="#" class="btn btn-outline">Cadastro</a>
          <button
            class="theme-toggle"
            id="themeToggle"
            aria-label="Alternar tema"
          >
            <i class="fas fa-moon"></i>
          </button>
          <button class="mobile-toggle" id="mobileToggle">
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>
      </nav>
    </header>

    <section id="home" class="hero">
      <div class="hero-content">
        <div class="hero-text">
          <h1 class="hero-title">
            Bem-vindo ao <span class="brand-name">Reequilibra</span>
          </h1>
          <p class="hero-description">
            Um espaço acolhedor e seguro dedicado ao seu bem-estar emocional.
            Encontre o equilíbrio que você precisa para uma vida mais plena e
            saudável.
          </p>
          <div class="hero-buttons">
            <a href="./modulos/login/index.html" class="btn btn-green">
              <i class="fas fa-play"></i> Começar Agora
            </a>
            <button class="btn btn-secondary" id="saibaMais">
              <i class="fas fa-info-circle"></i> Saiba Mais
            </button>
          </div>
        </div>
        <div class="hero-visual">
          <div class="hero-circle"></div>
          <div class="hero-gradient"></div>
        </div>
      </div>
    </section>

    <section id="about" class="about"></section>

    <section id="services" class="services"></section>

    <section id="testimonials" class="testimonials"></section>

    <section class="cta"></section>
    <footer class="footer"></footer>
    <script src="script.js"></script>
  </body>
</html>
